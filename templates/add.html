{% extends 'layout.html' %}
{% block content %}

<h1 class="text-2xl md:text-3xl font-bold mb-6">Add New Project</h1>

<div class="bg-white p-4 md:p-6 rounded shadow max-w-full md:max-w-md">
 <form method="POST" enctype="multipart/form-data">
  <div class="mb-4">
   <label class="block text-sm font-bold mb-2">Project Name</label>
   <input type="text" name="title" class="w-full px-3 py-2 border rounded" required>
  </div>
  
  <div class="mb-4">
   <label class="block text-sm font-bold mb-2">Price (₹)</label>
   <input type="number" name="budget" class="w-full px-3 py-2 border rounded" required>
  </div>
  
  <div class="mb-4">
   <label class="block text-sm font-bold mb-2">Contact Number</label>
   <input type="tel" name="contact" class="w-full px-3 py-2 border rounded" required>
  </div>
  
  <div class="mb-4">
   <label class="block text-sm font-bold mb-2">Image</label>
   <input type="file" name="image" accept="image/*" class="w-full px-3 py-2 border rounded" required>
  </div>
  
  <div class="mb-4">
   <label class="block text-sm font-bold mb-2">Rating (0-5)</label>
   <input type="number" name="rating" min="0" max="5" step="0.1" class="w-full px-3 py-2 border rounded" required>
  </div>
  
  <button type="submit" class="bg-blue-500 text-white px-4 py-2 rounded">Add Project</button>
 </form>
</div>

{% endblock %}
