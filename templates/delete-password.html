{% extends 'layout.html' %}
{% block content %}

<div class="flex items-center justify-center min-h-screen bg-gray-100 px-4">
 <div class="bg-white p-6 md:p-8 rounded shadow max-w-full md:max-w-md w-full">
  <h1 class="text-2xl md:text-3xl font-bold mb-6 text-center">Delete Protection</h1>
  
  <p class="text-gray-600 mb-6 text-center text-sm md:text-base">Enter password to delete this project</p>
  
  <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4 text-sm">
   ⚠️ This action cannot be undone
  </div>
  
  {% if error %}
  <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4 text-sm">
   {{ error }}
  </div>
  {% endif %}
  
  <form method="POST">
   <div class="mb-6">
    <label class="block text-sm font-bold mb-2">Password</label>
    <input type="password" name="password" class="w-full px-3 py-2 border rounded text-sm md:text-base" required autofocus>
   </div>
   
   <div class="space-x-2 flex flex-wrap gap-2">
    <button type="submit" class="bg-red-500 text-white px-4 py-2 rounded font-bold hover:bg-red-600 text-sm">Delete</button>
    <a href="/freelancer-dashboard" class="bg-gray-500 text-white px-4 py-2 rounded inline-block font-bold hover:bg-gray-600 text-sm">Cancel</a>
   </div>
  </form>
 </div>
</div>

{% endblock %}
