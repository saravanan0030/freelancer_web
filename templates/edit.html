{% extends 'layout.html' %}
{% block content %}

<h1 class="text-2xl md:text-3xl font-bold mb-6">Edit Project</h1>

<div class="bg-white p-4 md:p-6 rounded shadow max-w-full md:max-w-md">
 <form method="POST" enctype="multipart/form-data">
  <div class="mb-4">
   <label class="block text-sm font-bold mb-2">Project Name</label>
   <input type="text" name="title" class="w-full px-3 py-2 border rounded" value="{{project[2]}}" required>
  </div>
  
  <div class="mb-4">
   <label class="block text-sm font-bold mb-2">Price (₹)</label>
   <input type="number" name="budget" class="w-full px-3 py-2 border rounded" value="{{project[3]}}" required>
  </div>
  
  <div class="mb-4">
   <label class="block text-sm font-bold mb-2">Contact Number</label>
   <input type="tel" name="contact" class="w-full px-3 py-2 border rounded" value="{{project[6] if project[6] else ''}}" required>
  </div>
  
  <div class="mb-4">
   <label class="block text-sm font-bold mb-2">Image</label>
   {% if project[4] %}
   <div class="mb-3">
    <img src="/static/uploads/{{project[4]}}" alt="Current image" class="h-32 w-full object-cover rounded">
    <p class="text-sm text-gray-600 mt-2">Current image displayed above</p>
   </div>
   {% endif %}
   <input type="file" name="image" accept="image/*" class="w-full px-3 py-2 border rounded">
   <p class="text-xs text-gray-500 mt-1">Upload new image to replace current one</p>
  </div>
  
  <div class="mb-4">
   <label class="block text-sm font-bold mb-2">Rating (0-5)</label>
   <input type="number" name="rating" min="0" max="5" step="0.1" class="w-full px-3 py-2 border rounded" value="{{project[7]}}" required>
  </div>
  
  <div class="space-x-2">
   <button type="submit" class="bg-blue-500 text-white px-4 py-2 rounded">Update Project</button>
   <a href="/dashboard" class="bg-gray-500 text-white px-4 py-2 rounded inline-block">Cancel</a>
  </div>
 </form>
</div>

{% endblock %}
