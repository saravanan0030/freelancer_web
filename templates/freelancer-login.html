{% extends 'layout.html' %}
{% block content %}

<div class="flex items-center justify-center min-h-screen bg-gray-100 px-4">
 <div class="bg-white p-6 md:p-8 rounded shadow max-w-full md:max-w-md w-full">
  <h1 class="text-2xl md:text-3xl font-bold mb-6 text-center">Freelancer Login</h1>
  
  {% if error %}
  <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4">
    {{ error }}
  </div>
  {% endif %}
  
  <form method="POST">
   <div class="mb-4">
    <label class="block text-sm font-bold mb-2">Email</label>
    <input type="email" name="email" class="w-full px-3 py-2 border rounded text-sm md:text-base" required>
   </div>
   
   <div class="mb-6">
    <label class="block text-sm font-bold mb-2">Password</label>
    <input type="password" name="password" class="w-full px-3 py-2 border rounded text-sm md:text-base" required>
   </div>
   
   <button type="submit" class="w-full bg-purple-500 text-white px-4 py-2 rounded font-bold hover:bg-purple-600 text-sm md:text-base">Login</button>
  </form>
  
  <p class="text-center mt-4 text-sm md:text-base">
   <a href="/" class="text-purple-500 hover:underline">Back to Role Selection</a>
  </p>
 </div>
</div>

{% endblock %}
