
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
.fade-in { animation: fadeIn 0.8s ease; }
@keyframes fadeIn {
from {opacity:0; transform: translateY(15px);}
to {opacity:1; transform: translateY(0);}
}

.card:hover {
transform: translateY(-8px) scale(1.02);
transition: 0.3s;
box-shadow: 0 20px 40px rgba(0,0,0,0.2);
}

.sidebar-item:hover {
background: linear-gradient(to right,#3b82f6,#8b5cf6);
color:white;
padding-left:20px;
transition:0.3s;
}

.star:hover { transform: scale(1.3); transition:0.2s;}

.sidebar-transition {
transition: transform 0.3s ease-in-out, width 0.3s ease-in-out;
}

.sidebar-open {
transform: translateX(0) !important;
}

.sidebar-closed {
transform: translateX(-100%) !important;
}

/* For md and above, always show sidebar */
@media (min-width: 768px) {
  #sidebar {
    transform: translateX(0) !important;
    position: relative !important;
  }
}

/* Responsive table styles */
@media (max-width: 768px) {
  .responsive-table table {
    font-size: 0.875rem;
  }
  
  .responsive-table thead {
    display: none;
  }
  
  .responsive-table tbody,
  .responsive-table tr,
  .responsive-table td {
    display: block;
    width: 100%;
  }
  
  .responsive-table tr {
    margin-bottom: 1rem;
    border: 1px solid #e5e7eb;
    border-radius: 0.375rem;
  }
  
  .responsive-table td {
    text-align: right;
    padding: 0.75rem;
    padding-left: 50%;
    position: relative;
  }
  
  .responsive-table td:before {
    content: attr(data-label);
    position: absolute;
    left: 0.75rem;
    font-weight: 600;
    text-align: left;
  }
}

/* Responsive typography */
* {
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
</style>
</head>

<body class="bg-gradient-to-br from-slate-100 to-blue-200">

<!-- Mobile header -->
<div class="md:hidden bg-slate-900 text-white p-4 flex items-center justify-between">
  <h2 class="text-xl font-bold">Freelancer </h2>
  <button id="menu-toggle" class="text-white text-2xl focus:outline-none">
    <svg id="menu-icon" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
    </svg>
    <svg id="close-icon" class="w-6 h-6 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
    </svg>
  </button>
</div>

<div class="flex flex-col md:flex-row h-screen">

<!-- Sidebar -->
<div id="sidebar" class="sidebar-transition sidebar-closed md:sidebar-open w-64 h-screen bg-slate-900 text-white p-5 fixed md:static top-0 left-0 z-40 md:z-auto overflow-y-auto md:overflow-visible">

<h2 class="text-2xl font-bold mb-6 hidden md:block">Freelancer </h2>

<button id="close-btn" class="md:hidden text-white mb-4 text-lg">
  <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
  </svg>
</button>

{% if session.get('role') == 'client' %}
<a href="/dashboard" class="block p-2 sidebar-item rounded mb-2">Dashboard</a>
<a href="/add" class="block p-2 sidebar-item rounded mb-2">Add Project</a>
<a href="/logout" class="block p-2 sidebar-item rounded">Logout</a>
{% elif session.get('role') == 'freelancer' %}
<a href="/freelancer-dashboard" class="block p-2 sidebar-item rounded mb-2">Dashboard</a>
<a href="/portfolio/{{session.get('user_id')}}" class="block p-2 sidebar-item rounded mb-2">Portfolio</a>
<a href="/logout" class="block p-2 sidebar-item rounded">Logout</a>
{% endif %}

</div>

<!-- Overlay for mobile -->
<div id="overlay" class="hidden fixed inset-0 bg-black bg-opacity-50 z-30 md:hidden"></div>

<!-- Main content -->
<div class="flex-1 w-full overflow-auto">
<div class="p-4 md:p-6 fade-in">

{% block content %}{% endblock %}

</div>
</div>

</div>

<script>
const menuToggle = document.getElementById('menu-toggle');
const sidebar = document.getElementById('sidebar');
const overlay = document.getElementById('overlay');
const closeBtn = document.getElementById('close-btn');
const menuIcon = document.getElementById('menu-icon');
const closeIcon = document.getElementById('close-icon');

function toggleSidebar() {
  sidebar.classList.toggle('sidebar-open');
  sidebar.classList.toggle('sidebar-closed');
  overlay.classList.toggle('hidden');
  menuIcon.classList.toggle('hidden');
  closeIcon.classList.toggle('hidden');
}

function closeSidebar() {
  sidebar.classList.add('sidebar-closed');
  sidebar.classList.remove('sidebar-open');
  overlay.classList.add('hidden');
  menuIcon.classList.remove('hidden');
  closeIcon.classList.add('hidden');
}

menuToggle.addEventListener('click', toggleSidebar);
closeBtn.addEventListener('click', closeSidebar);
overlay.addEventListener('click', closeSidebar);

// Close sidebar when a link is clicked
document.querySelectorAll('#sidebar a').forEach(link => {
  link.addEventListener('click', closeSidebar);
});
</script>

</body>
</html>
