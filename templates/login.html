<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<title>Login - Freelancer</title>
</head>
<body class="bg-gradient-to-br from-slate-100 to-blue-200 min-h-screen flex items-center justify-center">

<div class="bg-white p-8 rounded shadow-lg max-w-md w-full mx-4">
  <h1 class="text-3xl font-bold mb-6 text-center text-gray-800">Login</h1>
  
  {% if error %}
  <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4">
    {{ error }}
  </div>
  {% endif %}
  
  <form method="POST">
   <div class="mb-4">
    <label class="block text-sm font-bold mb-2 text-gray-700">Email</label>
    <input type="email" name="email" class="w-full px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500" required>
   </div>
   
   <div class="mb-6">
    <label class="block text-sm font-bold mb-2 text-gray-700">Password</label>
    <input type="password" name="password" class="w-full px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500" required>
   </div>
   
   <button type="submit" class="w-full bg-blue-500 text-white px-4 py-2 rounded font-bold hover:bg-blue-600 transition">Login</button>
  </form>
</div>

</body>
</html>
