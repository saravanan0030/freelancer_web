
{% extends 'layout.html' %}
{% block content %}

<h1 class="text-2xl md:text-3xl font-bold mb-6">Public Portfolio</h1>

{% if projects %}
<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 md:gap-6">

{% for p in projects %}

<div class="bg-white rounded shadow card hover:shadow-lg transition">

{% if p[4] %}
<img src="/static/uploads/{{p[4]}}" alt="{{p[2]}}" class="h-40 w-full object-cover rounded-t">
{% else %}
<div class="h-40 w-full bg-gray-200 rounded-t flex items-center justify-center">
 <span class="text-gray-400">No Image</span>
</div>
{% endif %}

<div class="p-4">

<h2 class="font-bold text-xl mb-2">{{p[2]}}</h2>

<p class="text-green-600 font-semibold mb-1">₹{{p[3]}}</p>

<p class="text-yellow-500 mb-3">⭐ {{p[7]}}/5</p>

<a href="/review/{{p[0]}}" class="bg-blue-500 text-white px-3 py-1 rounded text-sm hover:bg-blue-600">
 Review
</a>

</div>

</div>

{% endfor %}

</div>

{% else %}

<div class="bg-white p-8 rounded shadow text-center">
 <p class="text-gray-600 text-lg">No projects available in portfolio</p>
</div>

{% endif %}

{% endblock %}
