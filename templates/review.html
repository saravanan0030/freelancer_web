
{% extends 'layout.html' %}
{% block content %}

<h1 class="text-2xl md:text-3xl font-bold mb-6">Submit Review</h1>

<div class="bg-white p-4 md:p-6 rounded shadow max-w-full md:max-w-md">
 <form method="POST" onsubmit="return validateForm()">
  
  <div class="mb-4">
   <label class="block text-sm font-bold mb-2">Client Name</label>
   <input name="client" placeholder="Enter your name" class="border p-2 w-full mb-3 rounded" required>
  </div>
  
  <div class="mb-4">
   <label class="block text-sm font-bold mb-2">Review</label>
   <textarea name="review" placeholder="Write your review" class="border p-2 w-full mb-3 rounded" required></textarea>
  </div>
  
  <div class="mb-4">
   <label class="block text-sm font-bold mb-2">Rating</label>
   <div class="flex gap-2 mb-3">
    {% for i in range(1,6) %}
    <span onclick="setRating({{i}})" class="star text-3xl cursor-pointer" data-rating="{{i}}">⭐</span>
    {% endfor %}
   </div>
   <input type="hidden" name="rating" id="rating" value="0">
   <p id="ratingText" class="text-sm text-gray-600">Select a rating</p>
  </div>
  
  <button type="submit" class="bg-green-500 text-white p-2 w-full rounded font-bold hover:bg-green-600">
   Submit Review
  </button>
 </form>
</div>

<script>
function setRating(val){
 document.getElementById("rating").value=val;
 document.getElementById("ratingText").textContent="Rating: "+val+" / 5";
}

function validateForm(){
 if(document.getElementById("rating").value == "0"){
  alert("Please select a rating");
  return false;
 }
 return true;
}
</script>

{% endblock %}
